<!DOCTYPE html>
<html lang="de" class="h-full bg-slate-900 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitalLife - Gesundheit, Ernährung & Vitalität</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0',
                            500: '#22c55e', 600: '#16a34a', 700: '#15803d', 800: '#166534', 900: '#14532d',
                        },
                        mint: { 100: '#e6fffa', 500: '#14b8a6', 600: '#0d9488' }
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-nav { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); }
    </style>
</head>
<body class="h-full font-sans antialiased flex flex-col min-h-screen bg-slate-900 text-slate-100">

    <!-- NAVIGATION HEADER -->
    <header class="sticky top-0 z-50 glass-nav border-b border-slate-800/80 shadow-2xl">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('dashboard')">
                    <div class="bg-gradient-to-tr from-brand-500 to-mint-500 text-slate-950 p-3 rounded-2xl shadow-lg shadow-brand-500/20">
                        <i class="fa-solid fa-heart-pulse text-2xl"></i>
                    </div>
                    <div>
                        <span class="text-2xl font-black bg-gradient-to-r from-brand-400 via-mint-400 to-emerald-300 bg-clip-text text-transparent">VitalLife</span>
                        <span class="block text-[10px] tracking-widest text-slate-400 font-bold uppercase -mt-1">Gesundheits-Guide</span>
                    </div>
                </div>

                <!-- Desktop Nav Links -->
                <nav class="hidden md:flex space-x-2 bg-slate-800/50 p-1.5 rounded-2xl border border-slate-700/50">
                    <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-btn px-4 py-2.5 rounded-xl text-xs font-bold transition-all duration-200"><i class="fa-solid fa-chart-pie mr-2"></i>Tracker</button>
                    <button onclick="switchTab('rezepte')" id="nav-rezepte" class="nav-btn px-4 py-2.5 rounded-xl text-xs font-bold transition-all duration-200"><i class="fa-solid fa-utensils mr-2"></i>Rezepte</button>
                    <button onclick="switchTab('vitamine')" id="nav-vitamine" class="nav-btn px-4 py-2.5 rounded-xl text-xs font-bold transition-all duration-200"><i class="fa-solid fa-apple-whole mr-2"></i>Vitamine & Früchte</button>
                    <button onclick="switchTab('rechner')" id="nav-rechner" class="nav-btn px-4 py-2.5 rounded-xl text-xs font-bold transition-all duration-200"><i class="fa-solid fa-calculator mr-2"></i>Rechner</button>
                    <button onclick="switchTab('profil')" id="nav-profil" class="nav-btn px-4 py-2.5 rounded-xl text-xs font-bold transition-all duration-200"><i class="fa-solid fa-user-gear mr-2"></i>Profil & Maße</button>
                    <button onclick="switchTab('bewertungen')" id="nav-bewertungen" class="nav-btn px-4 py-2.5 rounded-xl text-xs font-bold transition-all duration-200"><i class="fa-solid fa-comments mr-2"></i>Reviews</button>
                </nav>
            </div>
        </div>

        <!-- Mobile Navigation Bar -->
        <div class="md:hidden border-t border-slate-800 bg-slate-900/95 px-2 py-2 flex justify-around text-[10px] font-bold overflow-x-auto">
            <button onclick="switchTab('dashboard')" id="mob-nav-dashboard" class="p-2 flex flex-col items-center"><i class="fa-solid fa-chart-pie text-base mb-1"></i>Tracker</button>
            <button onclick="switchTab('rezepte')" id="mob-nav-rezepte" class="p-2 flex flex-col items-center"><i class="fa-solid fa-utensils text-base mb-1"></i>Rezepte</button>
            <button onclick="switchTab('vitamine')" id="mob-nav-vitamine" class="p-2 flex flex-col items-center"><i class="fa-solid fa-apple-whole text-base mb-1"></i>Vitamine</button>
            <button onclick="switchTab('rechner')" id="mob-nav-rechner" class="p-2 flex flex-col items-center"><i class="fa-solid fa-calculator text-base mb-1"></i>Rechner</button>
            <button onclick="switchTab('profil')" id="mob-nav-profil" class="p-2 flex flex-col items-center"><i class="fa-solid fa-user-gear text-base mb-1"></i>Maße</button>
            <button onclick="switchTab('bewertungen')" id="mob-nav-bewertungen" class="p-2 flex flex-col items-center"><i class="fa-solid fa-comments text-base mb-1"></i>Reviews</button>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- ================= TAB 1: DASHBOARD, TRACKER & STREAKS ================= -->
        <div id="tab-dashboard" class="tab-content space-y-8">
            
            <!-- Banner mit Streaks, Sternen & Medaillen -->
            <div class="relative overflow-hidden rounded-3xl bg-gradient-to-r from-brand-900 via-slate-800 to-mint-900 p-6 sm:p-8 border border-brand-500/30 shadow-2xl">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 relative z-10">
                    <div>
                        <span class="bg-brand-500/20 text-brand-400 px-3 py-1 rounded-full text-xs font-bold tracking-wider uppercase border border-brand-500/30">Tagesstreak & Erfolge</span>
                        <h1 class="text-3xl sm:text-4xl font-black mt-3 text-white">Dein gesunder Tag im Überblick</h1>
                        <p class="text-slate-300 text-sm mt-1">Schließe deine täglichen Ziele ab, um Sterne zu sammeln und Medaillen freizuschalten!</p>
                    </div>

                    <div class="flex items-center space-x-4 bg-slate-900/60 p-4 rounded-2xl border border-slate-700/60 backdrop-blur-md">
                        <div class="text-center">
                            <span class="text-2xl font-black text-amber-400 flex items-center justify-center gap-1"><i class="fa-solid fa-star text-amber-400"></i><span id="stars-count">0</span></span>
                            <span class="block text-[10px] uppercase text-slate-400 font-extrabold mt-0.5">Sterne</span>
                        </div>
                        <div class="h-8 w-px bg-slate-700"></div>
                        <div class="text-center">
                            <span class="text-2xl font-black text-white flex items-center justify-center gap-1"><i class="fa-solid fa-fire text-orange-500"></i><span id="streak-days">0</span>d</span>
                            <span class="block text-[10px] uppercase text-slate-400 font-extrabold mt-0.5">Streak</span>
                        </div>
                    </div>
                </div>

                <!-- Auszeichnungen / Medaillen -->
                <div class="mt-6 pt-6 border-t border-slate-700/60 grid grid-cols-1 sm:grid-cols-3 gap-4 relative
